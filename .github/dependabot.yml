version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint supports TypeScript >=4.8.4 <6.1.0; TypeScript 7 waits for it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Node types follow the Node.js lines the engine supports, not the newest release.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
